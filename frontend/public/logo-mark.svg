  <!-- rising bars on the right page -->
  <rect x="37" y="34" width="3.4" height="7" rx="1.2" fill="#0d7a6a"/>
  <rect x="42.2" y="29.5" width="3.4" height="11.5" rx="1.2" fill="#0d7a6a"/>
  <rect x="47.4" y="24.5" width="3.4" height="16.5" rx="1.2" fill="#14a88f"/>
</svg>
