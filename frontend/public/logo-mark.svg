<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenBooks">
  <defs>
    <linearGradient id="ob-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a88f"/>
      <stop offset="1" stop-color="#0a6b5d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#ob-tile)"/>
  <!-- open book: two pages meeting at the spine -->
  <path d="M12 19.5c6.4-2.1 12.7-1.7 18.6 1.6v27.3c-5.9-3.1-12.2-3.4-18.6-1.4z" fill="#fff" fill-opacity=".86"/>
